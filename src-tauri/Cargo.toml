[package]
name = "radium-math"
version = "0.1.0"
description = "Radium Math desktop shell"
authors = ["Isaiah Ware"]
license = "MIT"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (https://github.com/rust-lang/cargo/issues/8519).
name = "radium_math_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
